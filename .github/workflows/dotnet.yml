name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      RACEDAY_TEST_CONNECTION: "Server=localhost,1433;Database=RaceDayTests;User Id=sa;Password=RaceDay_TestPass123!;TrustServerCertificate=True;Encrypt=True"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "RaceDay_TestPass123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        working-directory: RaceDay
        run: dotnet restore

      - name: Build solution
        working-directory: RaceDay
        run: dotnet build --no-restore --configuration Release

      - name: Wait for SQL Server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null; then
              echo "SQL Server port is accepting connections."
              exit 0
            fi
            echo "Waiting for SQL Server; attempt $attempt of 30..."
            sleep 5
          done
          echo "SQL Server did not become ready."
          exit 1

      - name: Apply database migrations
        working-directory: RaceDay
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.0
          export PATH="$PATH:$HOME/.dotnet/tools"

          for attempt in {1..12}; do
            if dotnet ef database update \
              --project RaceDay.Api/RaceDay.Api.csproj \
              --startup-project RaceDay.Api/RaceDay.Api.csproj
            then
              echo "Database migrations applied successfully."
              exit 0
            fi

            echo "SQL Server may not be ready. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Database migration failed after multiple attempts."
          exit 1

      - name: Run unit tests
        working-directory: RaceDay
        run: dotnet test --no-build --configuration Release --verbosity normal
